<polygon points="200,625 207.6,618.5 209.9,626.4" fill="#374151"/>
<rect x="285" y="573" width="102.8" height="17" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-width="0.8"/>
<text x="290" y="585" font-size="11" fill="#1f2937" font-style="italic">consume / socket</text>
<line x1="550" y1="552" x2="390" y2="625" stroke="#374151" stroke-width="1.6" />
<polygon points="390,625 396.6,617.5 400.0,624.9" fill="#374151"/>
