<polygon points="620,625 619.7,615.0 627.2,618.1" fill="#374151"/>
<rect x="780" y="590" width="290" height="190" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="792" y="610" text-anchor="start" font-weight="700" font-size="14" fill="#111827">6. ALMACENAMIENTO DISTRIBUIDO</text>
<rect x="800" y="625" width="250" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="925.0" y="649.0" text-anchor="middle" font-weight="700" font-size="14" fill="#111827">PostgreSQL</text>
<text x="925.0" y="666.0" text-anchor="middle" font-size="12" fill="#374151">primario + réplicas · tareas y resultados</text>
<text x="925.0" y="681.0" text-anchor="middle" font-size="12" fill="#374151">en el código: SQLite (tareas.db)</text>
